<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Innovative Data Platform | Made by Saif for Innovative Research & Consultancy Ltd.</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #222B25 0%, #2D3931 100%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      border: 1px solid rgba(230, 216, 195, 0.3);
      animation: loginCardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes loginCardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header {
      background: linear-gradient(135deg, #5D866C 0%, #4E735B 100%);
      padding: 32px 28px;
      text-align: center;
      color: #FFFFFF;
      border-bottom: 1px solid var(--accent-taupe);
    }

    .login-badge {
      display: inline-block;
      background: var(--accent-sand);
      color: #1D2420;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
      border: 1px solid rgba(194, 166, 140, 0.4);
    }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .login-author {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-sand);
      margin-top: 4px;
      line-height: 1.4;
    }

    .login-body {
      padding: 32px 28px;
      background-color: #FFFFFF;
    }

    .demo-credentials-box {
      margin-top: 24px;
      padding: 16px;
      background-color: var(--bg-main);
      border: 1px dashed var(--accent-taupe);
      border-radius: var(--radius-md);
      font-size: 12px;
    }

    .demo-title {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .demo-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      color: var(--text-main);
    }

    .demo-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: translateX(3px);
    }

    .demo-btn:active {
      transform: scale(0.98);
    }

    .alert-error {
      display: none;
      background-color: var(--accent-red-light);
      color: var(--accent-red);
      border: 1px solid rgba(197, 78, 78, 0.3);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="login-badge">KoboToolbox Compatible • Enterprise Ready</div>
      <h1 class="login-title">Innovative Data Platform</h1>
      <div class="login-author">Made by Saif for Innovative Research & Consultancy Ltd.</div>
    </div>

    <div class="login-body">
      <div id="errorAlert" class="alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="userId">User ID / Username</label>
          <input 
            type="text" 
            id="userId" 
            name="user_id" 
            class="form-control" 
            placeholder="e.g. admin or SUP-1042" 
            required 
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Enter password" 
            required
          >
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
          <span>Sign In to Platform</span>
          <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <!-- Instant 1-Click Credentials for Review & Evaluation -->
      <div class="demo-credentials-box">
        <div class="demo-title">
          <span>One-Click Demo Credentials:</span>
          <span style="color: var(--primary); font-weight: 700;">Ready to Test</span>
        </div>
        <div class="demo-grid">
          <button type="button" class="demo-btn" onclick="fillCreds('admin', 'admin123')">
            <span style="display: flex; align-items: center; gap: 6px;">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <strong>Admin:</strong> admin
            </span>
            <span style="color: var(--text-muted); font-size: 11px;">admin123 [Click to Fill]</span>
          </button>
          <button type="button" class="demo-btn" onclick="fillCreds('SUP-1042', 'supervisor123')">
            <span style="display: flex; align-items: center; gap: 6px;">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <strong>Supervisor:</strong> SUP-1042
            </span>
            <span style="color: var(--text-muted); font-size: 11px;">supervisor123 [Click to Fill]</span>
          </button>
          <button type="button" class="demo-btn" onclick="fillCreds('TM-2001', 'member123')">
            <span style="display: flex; align-items: center; gap: 6px;">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
              <strong>Team Member:</strong> TM-2001
            </span>
            <span style="color: var(--text-muted); font-size: 11px;">member123 [Click to Fill]</span>
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted);">
        Innovative Data Platform • <strong>Made by Saif for Innovative Research & Consultancy Ltd.</strong>
      </div>
    </div>
  </div>

  <script>
    function fillCreds(u, p) {
      document.getElementById('userId').value = u;
      document.getElementById('password').value = p;
      document.getElementById('userId').focus();
    }

    const form = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const user_id = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value;

      if (!user_id || !password) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying credentials...</span>';

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user_profile', JSON.stringify(data.user));
          // Redirect to dashboard
          window.location.href = '/';
        } else {
          errorAlert.textContent = data.error || 'Login failed. Please check your credentials.';
          errorAlert.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In to Platform</span> <span>→</span>';
        }
      } catch (err) {
        errorAlert.textContent = 'Network or server error. Please make sure backend is running.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In to Platform</span> <span>→</span>';
      }
    });
  </script>
</body>
</html>
