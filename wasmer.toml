[package]
name = "monourhosan/innovative"
version = "1.0.0"
description = "Innovative Data Platform - Made by Saif"
license = "MIT"
readme = "README.md"

[dependencies]

[[volumes]]
name = "platform-data"

[[services]]
name = "web"
container = true
ports = [{ port = 8080, name = "http" }]
volumes = [{ name = "platform-data", mount = "/app/data" }]

[env]
PORT = "8080"
NODE_ENV = "production"
DATABASE_PATH = "/app/data/platform.db"
